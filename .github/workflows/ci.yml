name: Unified release CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
permissions:
  contents: read
concurrency:
  group: release-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          fetch-tags: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Fetch only tested ancestry, no unrelated branches or tags
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --no-recurse-submodules --unshallow origin "$SOURCE_SHA"
      - name: Canonical ancestry, source exclusions and unchanged numerical engines
        run: |
          git fsck --full
          node scripts/ci/release-guard.mjs
      - name: Workflow syntax and expressions
        run: python3 scripts/ci/check-workflow.py
      - name: Frozen dependencies without lifecycle scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json bun.lock
      - name: Build, lint and production packaging
        run: |
          npm run build
          npm run lint
          npm run package:production
      - name: All numerical, unit, integration, security and intelligence regressions
        run: npm test
      - name: Isolated system tests - all ten legacy assertions unchanged
        run: npm run test:system
      - name: Additive hosted financial and packaging security
        run: npm run test:security
  browser:
    name: Browser and accessibility
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Pinned QA tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/browser-requirements.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/thn-qa-tools" --no-save --package-lock=false --ignore-scripts axe-core@4.10.3
      - name: Build actual production package
        run: npm run package:production
      - name: Full canonical and v7 browser workflows, EN/AR, RTL, mobile, themes and axe
        env:
          AXE_PATH: ${{ runner.temp }}/thn-qa-tools/node_modules/axe-core/axe.min.js
        run: npm run test:browser
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: node scripts/ci/dependency-audit.mjs
