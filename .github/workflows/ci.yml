name: Clean development CI

on:
  push:
    branches: [develop, 'feature/**', 'fix/**', 'docs/**', 'release/**']
  pull_request:
    branches: [develop, 'release/**']

permissions:
  contents: read

concurrency:
  group: clean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Validation only: no environments, OIDC, deployment credentials, publishing,
# production triggers, privileged PR events, or executable uploaded artifacts.
jobs:
  verify:
    name: Source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch only tested ancestry, never legacy main or tags
        run: |
          test "$(git rev-parse HEAD)" = "$CI_SOURCE_SHA"
          git fetch --no-tags --no-recurse-submodules --unshallow origin "$CI_SOURCE_SHA"
          git fsck --full
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Source history and sensitive artifact guard
        run: node scripts/ci/source-guard.mjs
      - name: Workflow syntax and expression validation
        run: python3 scripts/ci/check-workflow.py
      - name: Frozen dependencies without lifecycle scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          git diff --exit-code -- package.json bun.lock
      - name: Build, lint and CI syntax
        run: |
          npm run build
          npm run lint
          node --check scripts/ci/source-guard.mjs
          node --check scripts/ci/dependency-audit.mjs
      - name: Regression, security, static artifact and release integrity tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Isolated system tests
        run: node tests/run-system.mjs

  browser:
    name: Browser and accessibility
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Pinned external QA tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/ci/browser-requirements.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/thn-qa-tools" --no-save --package-lock=false --ignore-scripts axe-core@4.10.3
      - name: Fixture browsers and static routing model
        run: |
          python tests/browser.test.py
          python tests/release-browser.test.py
          WORKSPACE_QA_OUTPUT="$RUNNER_TEMP/workspace-qa" python tests/workspace-ux.browser.py
          VERCEL_QA_OUTPUT="$RUNNER_TEMP/static-qa" python tests/vercel-staging.browser.py
      - name: EN/AR accessibility, dark and light
        env:
          AXE_PATH: ${{ runner.temp }}/thn-qa-tools/node_modules/axe-core/axe.min.js
        run: |
          ACCESSIBILITY_THEME=dark ACCESSIBILITY_OUTPUT="$RUNNER_TEMP/axe-dark.json" python tests/accessibility.test.py
          ACCESSIBILITY_THEME=light ACCESSIBILITY_OUTPUT="$RUNNER_TEMP/axe-light.json" python tests/accessibility.test.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: node scripts/ci/dependency-audit.mjs
